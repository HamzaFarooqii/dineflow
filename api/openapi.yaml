openapi: 3.0.3
info:
  title: Counterline Terminal Access API
  version: 1.0.0
  description: |
    Terminal access only. Owner email authentication remains with Supabase.
    Serve through a same-origin /api proxy. Mutations require the exact configured
    Origin. Responses are no-store. Credentials are opaque HttpOnly, SameSite=Strict
    cookies (Secure in production), never JSON or browser storage tokens.
    Device access lasts 15 minutes. Device refresh sessions last 30 days and retain
    a 60-second single-use retry window after rotation for lost-response recovery.
    Refresh revalidates an unexpired cashier session; changed/inactive employees lock.
    Provision and refresh return only the active employee credential projection.
    Offline access is limited to seven days; manager approvals to 72 hours.
    Cashier catalog bootstrap and checkout use the terminal access plus cashier-session
    cookies. They are scoped to the terminal's store; a caller cannot choose another store.
servers:
  - url: /api
security: []
paths:
  /devices/provision:
    post:
      operationId: provisionTerminal
      summary: Owner or manager provisions this browser with a fresh identity and receipt prefix
      security: [{ ownerBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [store_id, name]
              properties:
                store_id: { type: string, format: uuid }
                name: { type: string, minLength: 1, maxLength: 80 }
      responses:
        '201':
          description: Fresh installation; sets terminal_access and terminal_refresh cookies and clears cashier cookie. A valid refresh credential revokes this browser's previous installation even when moving between managed stores.
          headers:
            Set-Cookie: { schema: { type: string }, description: HttpOnly terminal credentials, Path=/api }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Projection' }
        default: { $ref: '#/components/responses/Error' }
  /auth/login:
    post:
      operationId: loginCashier
      summary: Select employee and verify PIN within the authenticated device's store
      description: Five failed attempts lock the device and employee for 60 seconds. Unknown/cross-store employees count toward the device limit. A successful login replaces the device's previous cashier session.
      security: [{ deviceAccess: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [employee_id, pin]
              properties:
                employee_id: { type: string, format: uuid }
                pin: { type: string, pattern: '^[0-9]{4,8}$', writeOnly: true }
      responses:
        '200':
          description: Verified cashier session; sets terminal_cashier cookie for 15 minutes
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Projection' }
                  - type: object
                    required: [session]
        '429':
          description: PIN access locked; no offline downgrade permitted
          headers:
            Retry-After: { schema: { type: integer }, description: Seconds until retry; 60 }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        default: { $ref: '#/components/responses/Error' }
  /auth/refresh:
    post:
      operationId: refreshTerminal
      summary: Rotate terminal cookies and replace the cached employee projection
      description: Serializes rotation into a new device-session record. The previous access token is immediately invalid; its refresh token may retry for 60 seconds to replace an unreachable child after a lost response. Concurrent browser calls must use the terminal Web Lock. Does not reset lockout counters.
      security: [{ deviceRefresh: [] }]
      responses:
        '200':
          description: Updated projection. Session appears only if its existing cashier cookie is unexpired and current permissions match. Sets new terminal cookies and rotates or clears the cashier cookie.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Projection' }
        default: { $ref: '#/components/responses/Error' }
  /auth/logout:
    post:
      operationId: logoutCashier
      summary: Expire the current device's cashier sessions and clear the cashier cookie
      security: [{ deviceAccess: [] }]
      responses:
        '204': { description: Cashier locked; device refresh session retained }
        default: { $ref: '#/components/responses/Error' }
  /terminal-auth/manage/{storeId}:
    get:
      operationId: getTerminalManagement
      summary: List employee metadata and terminals without credentials
      security: [{ ownerBearer: [] }]
      parameters:
        - { name: storeId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Only the manager's selected store
          content:
            application/json:
              schema:
                type: object
                required: [employees, devices]
                properties:
                  employees: { type: array, items: { $ref: '#/components/schemas/ManagedEmployee' } }
                  devices: { type: array, items: { $ref: '#/components/schemas/ManagedDevice' } }
        default: { $ref: '#/components/responses/Error' }
  /terminal-auth/employees:
    post:
      operationId: saveTerminalEmployee
      summary: Manager creates or updates separate employee PIN access
      security: [{ ownerBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [store_id, name, role, active]
              properties:
                id: { type: string, format: uuid, description: Omit to create }
                store_id: { type: string, format: uuid }
                name: { type: string, minLength: 1, maxLength: 80 }
                role: { type: string, enum: [cashier, manager] }
                active: { type: boolean }
                pin: { type: string, pattern: '^([0-9]{4,8})?$', writeOnly: true, description: Required on create; omit or empty on update to preserve PIN }
      responses:
        '200':
          description: Updated employee with incremented permission version; previous cashier sessions expired
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManagedEmployee' }
        '201':
          description: Created employee
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManagedEmployee' }
        default: { $ref: '#/components/responses/Error' }
  /terminal-auth/devices/{id}/revoke:
    post:
      operationId: revokeTerminal
      summary: Revoke device access and refresh credentials
      description: Idempotent. Offline devices cannot learn revocation until connectivity returns; their existing authorization window still applies.
      security: [{ ownerBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [store_id]
              properties:
                store_id: { type: string, format: uuid }
      responses:
        '204': { description: Terminal revoked }
        default: { $ref: '#/components/responses/Error' }
  /terminal-auth/devices/{id}/reactivate:
    post:
      operationId: reactivateTerminal
      summary: Restore a revoked device's active status
      description: Fails with 404 if the device is not found or is already active. Fails with 409 if another active terminal in the store already uses this device's name. The browser previously using this device must sign in again; its old sessions stay revoked.
      security: [{ ownerBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [store_id]
              properties:
                store_id: { type: string, format: uuid }
      responses:
        '204': { description: Terminal reactivated }
        default: { $ref: '#/components/responses/Error' }
  /catalog/snapshot:
    get:
      operationId: getCatalogSnapshot
      summary: Load the active store catalog and stock snapshot
      security: [{ ownerBearer: [] }]
      parameters:
        - { name: store_id, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Store-scoped catalog snapshot
          content:
            application/json:
              schema:
                type: object
                required: [store, catalog_version, checkpoint, categories, tax_rates, products, stock]
        default: { $ref: '#/components/responses/Error' }
  /orders/push:
    post:
      operationId: pushOrder
      summary: Save one immutable order, payment, and stock movement idempotently
      security: [{ ownerBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [operation_id, order, items, payment]
      responses:
        '200':
          description: Accepted order or identical replay
          content:
            application/json:
              schema:
                type: object
                required: [status, operation_id, accepted_checkpoint]
        '409': { description: Operation ID reused with another payload }
        '422': { description: Rejected validation, totals, or store reference }
        default: { $ref: '#/components/responses/Error' }
  /pos/catalog/snapshot:
    get:
      operationId: getTerminalCatalogSnapshot
      summary: Load the provisioned terminal's store catalog and stock snapshot
      security: [{ deviceAccess: [] }, { cashierSession: [] }]
      parameters:
        - { name: store_id, in: query, required: true, schema: { type: string, format: uuid }, description: Must equal the authenticated terminal store. }
      responses:
        '200': { description: Store-scoped catalog snapshot for the unlocked cashier terminal }
        default: { $ref: '#/components/responses/Error' }
  /pos/orders/push:
    post:
      operationId: pushTerminalOrder
      summary: Save one cashier-terminal order idempotently
      security: [{ deviceAccess: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [operation_id, order, items, payment]
      responses:
        '200': { description: Accepted order or identical replay }
        '401': { description: Device session is missing, expired, or revoked; queued sales remain local }
        '403': { description: Payload store does not match the terminal store }
        default: { $ref: '#/components/responses/Error' }
  /customers:
    get:
      operationId: searchManagementCustomers
      summary: Search customers in an active owner/manager store membership
      security: [{ ownerBearer: [] }]
      parameters:
        - { name: store_id, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: phone, in: query, required: true, schema: { type: string, pattern: '^\+[1-9][0-9]{3,14}$' } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200': { description: Store-scoped customer matches and next cursor, content: { application/json: { schema: { $ref: '#/components/schemas/CustomerSearch' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /pos/customers:
    get:
      operationId: searchCashierCustomers
      summary: Phone search only; never returns an unfiltered directory
      security: [{ deviceAccess: [], cashierSession: [] }]
      parameters:
        - { name: phone, in: query, required: true, schema: { type: string, pattern: '^\+[1-9][0-9]{3,14}$' } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200': { description: Bounded store-scoped customer matches, content: { application/json: { schema: { $ref: '#/components/schemas/CustomerSearch' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /customers/push:
    post:
      operationId: pushManagementCustomer
      summary: Idempotently create one store customer
      security: [{ ownerBearer: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CustomerCreateOperation' } } } }
      responses:
        '200': { description: Accepted or replayed durable result, content: { application/json: { schema: { $ref: '#/components/schemas/CustomerPushResult' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /pos/customers/push:
    post:
      operationId: pushTerminalCustomer
      summary: Upload a queued customer with device authorization even if its cashier logged out
      security: [{ deviceAccess: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CustomerCreateOperation' } } } }
      responses:
        '200': { description: Accepted or replayed durable result, content: { application/json: { schema: { $ref: '#/components/schemas/CustomerPushResult' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /reports/daily-summary:
    get:
      operationId: getDailySummary
      summary: Aggregate a store's sales for one calendar day, computed in the store's own timezone
      security: [{ ownerBearer: [] }]
      parameters:
        - { name: store_id, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: date, in: query, required: true, schema: { type: string, format: date }, description: Calendar date (YYYY-MM-DD) in the store's own timezone. }
      responses:
        '200': { description: Store-wide totals across every device, content: { application/json: { schema: { $ref: '#/components/schemas/DailySummary' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /reports/orders:
    get:
      operationId: getReportOrders
      summary: Cross-device drill-down of a store's orders for one calendar day
      security: [{ ownerBearer: [] }]
      parameters:
        - { name: store_id, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: date, in: query, required: true, schema: { type: string, format: date } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200': { description: Store-scoped order page and next cursor, content: { application/json: { schema: { $ref: '#/components/schemas/ReportOrdersPage' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /reports/oversold:
    get:
      operationId: getOversold
      summary: List products with negative server-truth stock for a store
      security: [{ ownerBearer: [] }]
      parameters:
        - { name: store_id, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Products whose pos_stock.current_stock is below zero, most oversold first
          content:
            application/json:
              schema:
                type: object
                required: [products]
                properties:
                  products: { type: array, items: { $ref: '#/components/schemas/OversoldProduct' } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /public/qr/sessions:
    post:
      operationId: createQrSession
      summary: Exchange a table QR code for a short-lived customer session
      description: |
        Public. Disabled (404 feature_disabled) unless QR_ORDERING_ENABLED=true. Store and table are
        resolved from the QR code; the request carries nothing else. Sessions last 120 minutes, are bound
        to one table and QR generation, and end when the code rotates or is revoked or the table is
        cleaned, freed, disabled or paid. Integration point: sessionIssuance rate-limit hook.
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [code], additionalProperties: false, properties: { code: { type: string, pattern: '^[a-f0-9]{64}$' } } } } }
      responses:
        '201': { description: Session issued. Send session_token as a Bearer token., content: { application/json: { schema: { $ref: '#/components/schemas/QrSessionIssued' } } } }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /public/qr/menu:
    get:
      operationId: getQrMenu
      summary: Public-safe menu projection for the session table
      description: Excludes combos, unavailable and non-direct-sale products, stock, tax rates and employee data. 403 menu_disabled in waiter_only mode.
      security: [{ qrSession: [] }]
      responses:
        '200': { description: Menu, content: { application/json: { schema: { $ref: '#/components/schemas/QrMenu' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /public/qr/orders:
    post:
      operationId: submitQrOrder
      summary: Submit an order for the session table
      description: |
        Strict body: only operation_id, items[product_id, quantity 1-20, modifier_option_ids] and note.
        Prices, tax, service charge and availability are resolved by the server; any other field is a
        422 forbidden_field. Replaying an operation_id with the same content returns the original result
        (200, replayed=true); with different content it is a 409 operation_id_conflict. The order becomes
        awaiting_confirmation, or is added to the table open check immediately when the table does not
        require confirmation. No kitchen ticket is created: kitchen tickets are only created when staff
        close the check.
      security: [{ qrSession: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/QrOrderRequest' } } }
      responses:
        '200': { description: Replay of an earlier submission, content: { application/json: { schema: { $ref: '#/components/schemas/QrOrderResult' } } } }
        '201': { description: Submission accepted, content: { application/json: { schema: { $ref: '#/components/schemas/QrOrderResult' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
    get:
      operationId: listQrOrders
      summary: Customer-safe status of this session own submissions
      security: [{ qrSession: [] }]
      responses:
        '200': { description: Own submissions only, content: { application/json: { schema: { type: object, required: [orders], properties: { orders: { type: array, items: { $ref: '#/components/schemas/QrCustomerOrder' } } } } } } }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /qr/tables:
    get:
      operationId: listQrTables
      summary: Manager - QR state of every active table
      security: [{ ownerBearer: [] }]
      parameters: [{ name: store_id, in: query, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Tables, content: { application/json: { schema: { type: object, required: [tables], properties: { tables: { type: array, items: { $ref: '#/components/schemas/QrTable' } } } } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /qr/tables/{id}/code:
    post:
      operationId: rotateQrCode
      summary: Manager - generate or rotate a table QR code (the raw code is returned once)
      description: Revokes every session for the table and invalidates the previous code.
      security: [{ ownerBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: store_id, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        '201': { description: New code, content: { application/json: { schema: { $ref: '#/components/schemas/QrCodeIssued' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      operationId: revokeQrCode
      summary: Manager - disable the table QR code and end its sessions
      security: [{ ownerBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: store_id, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Revoked, content: { application/json: { schema: { type: object, required: [status], properties: { status: { type: string, enum: [revoked] } } } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /qr/tables/{id}/settings:
    patch:
      operationId: updateQrSettings
      summary: Manager - change ordering mode and/or waiter confirmation for a table
      description: Takes effect on the next customer request; existing sessions stay valid.
      security: [{ ownerBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: store_id, in: query, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, additionalProperties: false, properties: { mode: { type: string, enum: [menu_only, menu_and_order, waiter_only] }, require_confirmation: { type: boolean } } } } }
      responses:
        '200': { description: Updated settings, content: { application/json: { schema: { $ref: '#/components/schemas/QrTable' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /qr/submissions:
    get:
      operationId: listQrSubmissions
      summary: Manager - customer submissions by status (default pending)
      description: Terminal twin at /pos/qr/submissions (cashier session, store must match the terminal). Integration point - staffConfirmation hook.
      security: [{ ownerBearer: [] }]
      parameters:
        - { name: store_id, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: string, enum: [pending, confirmed, rejected], default: pending } }
      responses:
        '200': { description: Submissions, content: { application/json: { schema: { type: object, required: [submissions], properties: { submissions: { type: array, items: { $ref: '#/components/schemas/QrStaffSubmission' } } } } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /qr/submissions/{id}/confirm:
    post:
      operationId: confirmQrSubmission
      summary: Staff - append a pending submission to the table open check (idempotent)
      description: Terminal twin at /pos/qr/submissions/{id}/confirm. 409 submission_rejected, 409 table_not_accepting_orders (reject it instead).
      security: [{ ownerBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: store_id, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Confirmed, content: { application/json: { schema: { type: object, required: [status, check_id, replayed], properties: { status: { type: string, enum: [confirmed] }, check_id: { type: string, format: uuid }, replayed: { type: boolean } } } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /qr/submissions/{id}/reject:
    post:
      operationId: rejectQrSubmission
      summary: Staff - decline a pending submission (idempotent)
      description: Terminal twin at /pos/qr/submissions/{id}/reject. 409 submission_confirmed once it is on the check.
      security: [{ ownerBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: store_id, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Rejected, content: { application/json: { schema: { type: object, required: [status, replayed], properties: { status: { type: string, enum: [rejected] }, replayed: { type: boolean } } } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    ownerBearer: { type: http, scheme: bearer, bearerFormat: Supabase JWT }
    deviceAccess: { type: apiKey, in: cookie, name: terminal_access }
    deviceRefresh: { type: apiKey, in: cookie, name: terminal_refresh }
    cashierSession: { type: apiKey, in: cookie, name: terminal_cashier }
    qrSession: { type: http, scheme: bearer, description: 'Customer table session from POST /public/qr/sessions. Never a staff or terminal credential.' }
  responses:
    Error:
      description: '400 invalid request; 401 invalid credentials/PIN; 403 origin or manager access denied; 404 entity missing in store; 429 lockout; 500 unavailable. HTTP authentication failures must not fall back to cached login.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    QrSessionIssued:
      type: object
      required: [session_token, expires_at, store_name, currency, table_label, mode, requires_confirmation]
      properties:
        session_token: { type: string, pattern: '^[a-f0-9]{64}$' }
        expires_at: { type: string, format: date-time }
        store_name: { type: string }
        currency: { type: string }
        table_label: { type: string }
        mode: { type: string, enum: [menu_only, menu_and_order, waiter_only] }
        requires_confirmation: { type: boolean }
    QrMenu:
      type: object
      required: [table_label, mode, requires_confirmation, expires_at, ordering_available, categories, products]
      properties:
        table_label: { type: string }
        mode: { type: string, enum: [menu_only, menu_and_order, waiter_only] }
        requires_confirmation: { type: boolean }
        expires_at: { type: string, format: date-time }
        ordering_available: { type: boolean }
        categories: { type: array, items: { type: object, required: [id, name], properties: { id: { type: string, format: uuid }, name: { type: string } } } }
        products:
          type: array
          items:
            type: object
            required: [id, name, category_id, price_cents, image_url, modifier_groups]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              category_id: { type: string, format: uuid, nullable: true }
              price_cents: { type: integer, minimum: 0 }
              image_url: { type: string, nullable: true }
              modifier_groups:
                type: array
                items:
                  type: object
                  required: [id, name, selection, required, options]
                  properties:
                    id: { type: string, format: uuid }
                    name: { type: string }
                    selection: { type: string, enum: [single, multi] }
                    required: { type: boolean }
                    options: { type: array, items: { type: object, required: [id, name, price_delta_cents], properties: { id: { type: string, format: uuid }, name: { type: string }, price_delta_cents: { type: integer } } } }
    QrOrderRequest:
      type: object
      required: [operation_id, items]
      additionalProperties: false
      properties:
        operation_id: { type: string, format: uuid }
        note: { type: string, maxLength: 300, nullable: true }
        items:
          type: array
          minItems: 1
          maxItems: 30
          items:
            type: object
            required: [product_id, quantity]
            additionalProperties: false
            properties:
              product_id: { type: string, format: uuid }
              quantity: { type: integer, minimum: 1, maximum: 20 }
              modifier_option_ids: { type: array, maxItems: 20, uniqueItems: true, items: { type: string, format: uuid } }
    QrCustomerOrder:
      type: object
      required: [id, status, created_at, decided_at, note, items, subtotal_cents, tax_cents]
      description: Customer-safe. awaiting_confirmation then added_to_check or declined. Never claims kitchen preparation.
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [awaiting_confirmation, added_to_check, declined] }
        created_at: { type: string, format: date-time }
        decided_at: { type: string, format: date-time, nullable: true }
        note: { type: string, nullable: true }
        items: { type: array, items: { type: object, required: [name, quantity, modifiers, total_cents], properties: { name: { type: string }, quantity: { type: integer }, modifiers: { type: array, items: { type: string } }, total_cents: { type: integer } } } }
        subtotal_cents: { type: integer }
        tax_cents: { type: integer }
    QrOrderResult:
      type: object
      required: [replayed, submission]
      properties:
        replayed: { type: boolean }
        submission: { $ref: '#/components/schemas/QrCustomerOrder' }
    QrTable:
      type: object
      properties:
        id: { type: string, format: uuid }
        label: { type: string }
        status: { type: string }
        qr_enabled: { type: boolean }
        qr_mode: { type: string, enum: [menu_only, menu_and_order, waiter_only] }
        qr_require_confirmation: { type: boolean }
        qr_generation: { type: integer }
        qr_rotated_at: { type: string, format: date-time, nullable: true }
    QrCodeIssued:
      type: object
      required: [id, label, code]
      properties:
        id: { type: string, format: uuid }
        label: { type: string }
        code: { type: string, pattern: '^[a-f0-9]{64}$', description: Shown once. Only its sha256 is stored. }
        qr_mode: { type: string }
        qr_require_confirmation: { type: boolean }
        qr_generation: { type: integer }
    QrStaffSubmission:
      type: object
      properties:
        id: { type: string, format: uuid }
        table_id: { type: string, format: uuid }
        table_label: { type: string }
        table_status: { type: string }
        status: { type: string, enum: [pending, confirmed, rejected] }
        note: { type: string, nullable: true }
        auto_confirmed: { type: boolean }
        created_at: { type: string, format: date-time }
        decided_at: { type: string, format: date-time, nullable: true }
        check_id: { type: string, format: uuid, nullable: true }
        items: { type: array, items: { type: object } }
        subtotal_cents: { type: integer }
        tax_cents: { type: integer }
    Customer:
      type: object
      required: [id, store_id, name, phone_normalized]
      properties:
        id: { type: string, format: uuid }
        store_id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 30 }
        phone_normalized: { type: string, nullable: true, pattern: '^[1-9][0-9]{3,14}$' }
    CustomerSearch:
      type: object
      required: [customers, next_cursor]
      properties:
        customers: { type: array, items: { $ref: '#/components/schemas/Customer' } }
        next_cursor: { type: string, nullable: true, description: Opaque pagination cursor; null means no further page. }
    CustomerCreateOperation:
      type: object
      required: [operation_id, entity_type, schema_version, customer]
      properties:
        operation_id: { type: string, format: uuid, description: Stable across all retries. }
        entity_type: { type: string, enum: [customer] }
        schema_version: { type: integer, enum: [1] }
        customer:
          type: object
          required: [id, store_id, name, phone_normalized, client_generated_at]
          properties:
            id: { type: string, format: uuid, description: Stable client-generated customer UUID. }
            store_id: { type: string, format: uuid, description: Must equal authenticated store; never grants authorization. }
            name: { type: string, minLength: 1, maxLength: 30 }
            phone_normalized: { type: string, nullable: true, pattern: '^[1-9][0-9]{3,14}$' }
            client_generated_at: { type: string, format: date-time }
    DailySummary:
      type: object
      required: [grossSalesCents, discountCents, netSalesCents, taxCents, cashTakingsCents, cardTakingsCents, recordedTotalCents, completedOrderCount, averageSaleCents, itemsSold, refundedCount, refundedAmountCents]
      description: Field names match LocalSalesReport in apps/web/src/lib/reporting.ts so the frontend can consume either shape uniformly.
      properties:
        grossSalesCents: { type: integer }
        discountCents: { type: integer }
        netSalesCents: { type: integer }
        taxCents: { type: integer }
        cashTakingsCents: { type: integer }
        cardTakingsCents: { type: integer }
        recordedTotalCents: { type: integer }
        completedOrderCount: { type: integer }
        averageSaleCents: { type: integer }
        itemsSold: { type: integer }
        refundedCount: { type: integer }
        refundedAmountCents: { type: integer }
    ReportOrderSummary:
      type: object
      required: [id, receiptNumber, time, totalCents, paymentMethod, itemCount, syncStatus, employeeId, cashierName, refunded]
      properties:
        id: { type: string, format: uuid }
        receiptNumber: { type: string }
        time: { type: string, format: date-time }
        totalCents: { type: integer }
        paymentMethod: { type: string, enum: [cash, card, unknown] }
        itemCount: { type: integer }
        syncStatus: { type: string, enum: [synced] }
        employeeId: { type: string, format: uuid, nullable: true }
        cashierName: { type: string, nullable: true }
        refunded: { type: boolean }
    ReportOrdersPage:
      type: object
      required: [orders, next_cursor]
      properties:
        orders: { type: array, items: { $ref: '#/components/schemas/ReportOrderSummary' } }
        next_cursor: { type: string, nullable: true, description: Opaque pagination cursor; null means no further page. }
    OversoldProduct:
      type: object
      required: [id, name, sku, current_stock]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        sku: { type: string }
        current_stock: { type: integer, description: Negative when oversold. }
    CustomerPushResult:
      type: object
      required: [status, operation_id, customer_id, accepted_checkpoint]
      properties:
        status: { type: string, enum: [accepted, replayed] }
        operation_id: { type: string, format: uuid }
        customer_id: { type: string, format: uuid }
        accepted_checkpoint: { type: string, pattern: '^[0-9]+$' }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string, enum: [validation_failed, authentication_required, origin_rejected, manager_required, employee_not_found, device_not_found, pin_locked, pin_invalid, server_unavailable] }
        message: { type: string }
    Device:
      type: object
      required: [id, store_id, name, receipt_prefix]
      properties:
        id: { type: string, format: uuid }
        store_id: { type: string, format: uuid }
        name: { type: string }
        receipt_prefix: { type: string, description: Globally unique installation UUID followed by a hyphen; never reused. Checkout appends a six-digit-minimum sequence in its own transaction. }
    ManagedDevice:
      type: object
      required: [id, name, receipt_prefix, created_at, revoked_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        receipt_prefix: { type: string }
        created_at: { type: string, format: date-time }
        revoked_at: { type: string, format: date-time, nullable: true }
    ManagedEmployee:
      type: object
      required: [id, name, role, active, permission_version]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        role: { type: string, enum: [cashier, manager] }
        active: { type: boolean }
        permission_version: { type: integer, minimum: 1 }
    CachedEmployee:
      type: object
      required: [id, name, role, permission_version, locked_until, verifier]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        role: { type: string, enum: [cashier, manager] }
        permission_version: { type: integer, minimum: 1 }
        locked_until: { type: string, format: date-time, nullable: true }
        verifier:
          type: object
          required: [version, algorithm, iterations, salt, hash]
          properties:
            version: { type: integer, enum: [1] }
            algorithm: { type: string, enum: [PBKDF2-SHA256] }
            iterations: { type: integer, enum: [600000] }
            salt: { type: string, pattern: '^[0-9a-f]{32}$' }
            hash: { type: string, pattern: '^[0-9a-f]{64}$' }
    Session:
      type: object
      required: [employee_id, permission_version, logged_in_at, last_server_validated_at]
      properties:
        employee_id: { type: string, format: uuid }
        permission_version: { type: integer, minimum: 1 }
        logged_in_at: { type: string, format: date-time }
        last_server_validated_at: { type: string, format: date-time }
    Projection:
      type: object
      required: [device, validated_at, locked_until, employees]
      properties:
        device: { $ref: '#/components/schemas/Device' }
        validated_at: { type: string, format: date-time }
        locked_until: { type: string, format: date-time, nullable: true }
        employees: { type: array, items: { $ref: '#/components/schemas/CachedEmployee' } }
        session: { $ref: '#/components/schemas/Session' }
